events {}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  server {
    listen 80;
    client_max_body_size 128m;

    location = /pgadmin {
      return 302 /pgadmin/;
    }

    location = /_ogoj_pgadmin_auth {
      internal;
      proxy_pass http://ogoj:8080/api/admin/pgadmin/sso;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header Cookie $http_cookie;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /pgadmin/ {
      auth_request /_ogoj_pgadmin_auth;
      auth_request_set $pgadmin_user $upstream_http_x_pgadmin_user;
      proxy_set_header X-Script-Name /pgadmin;
      proxy_set_header X-Forwarded-Prefix /pgadmin;
      proxy_set_header Remote-User $pgadmin_user;
      proxy_set_header Remote-User-Email $pgadmin_user;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://pgadmin:80/;
    }

    location / {
      proxy_pass http://ogoj:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_connect_timeout 30s;
      proxy_send_timeout 300s;
      proxy_read_timeout 300s;
      proxy_buffering off;
    }
  }
}
