services:
  ogoj:
    build: .
    image: ogoj:latest
    container_name: ogoj
    restart: unless-stopped
    ports:
      - '8080:8080'
    environment:
      NODE_ENV: production
      PORT: 8080
      HOST: 0.0.0.0
      SITE_URL: http://localhost:8080
      # CHANGE THIS to a long random string: openssl rand -hex 48
      JWT_SECRET: ${JWT_SECRET:-please-change-this-to-a-long-random-string}
      JUDGE_CONCURRENCY: '2'
      JUDGE_ENABLED: 'true'
      ROOT_USERNAME: root
      ROOT_PASSWORD: ogoj123456
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
